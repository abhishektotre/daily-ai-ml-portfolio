name: Daily AI & Data Science Project Cloud Automation

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Orchestrator Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate, Execute & Deploy Today's Standalone Project
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_GH_TOKEN }}
          GITHUB_USERNAME: abhishektotre
        run: |
          python -m automation.runner --generate --execute --deploy

      - name: Commit & Push Dashboard Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No state or showcase changes to commit."
          else
            LATEST_MSG=$(python -c 'import json; s=json.load(open("automation/state.json")); p=s["projects_history"][-1]; print(f"🚀 Day {p[\"day\"]:03d}: {p[\"title\"]} [{p[\"domain\"]}]")')
            git commit -m "$LATEST_MSG"
            git push origin main
          fi
