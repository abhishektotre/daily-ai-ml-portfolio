name: Daily AI & Data Science Project Cloud Automation

on:
  schedule:
    # Multiple staggered off-peak schedules across early morning (IST)
    - cron: '37 20 * * *' # 02:07 AM IST
    - cron: '19 22 * * *' # 03:49 AM IST
    - cron: '43 0 * * *'  # 06:13 AM IST
    - cron: '27 2 * * *'  # 07:57 AM IST
    - cron: '13 4 * * *'  # 09:43 AM IST
    - cron: '31 6 * * *'  # 12:01 PM IST
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Orchestrator Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate, Execute & Deploy Today's Standalone Project
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_GH_TOKEN }}
          GITHUB_USERNAME: abhishektotre
        run: |
          python -m automation.runner --generate --execute --deploy

      - name: Commit & Push Dashboard Updates
        run: |
          git config --global user.name "Abhishek"
          git config --global user.email "abhishektotre22@gmail.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No state or showcase changes to commit."
          else
            LATEST_MSG=$(python -c 'import json; s=json.load(open("automation/state.json")); p=s["projects_history"][-1]; print("🚀 Day {:03d}: {} [{}]".format(p["day"], p["title"], p["domain"]))')
            git commit -m "$LATEST_MSG"
            git push origin main
          fi
