name: Daily AI & Data Science Project Automation

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Execute Today's Project
        run: |
          python automation/runner.py --generate --execute

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            LATEST_MSG=$(python -c 'import json; s=json.load(open("automation/state.json")); p=s["projects_history"][-1]; print(f"🚀 Day {p[\"day\"]:03d}: {p[\"title\"]} [{p[\"domain\"]}]")')
            git commit -m "$LATEST_MSG"
            git push origin main
          fi
